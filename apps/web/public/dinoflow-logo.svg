<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="dinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Water Capsule -->
  <rect width="200" height="200" rx="48" fill="#091326" />
  <circle cx="100" cy="100" r="85" fill="#0c1e3d" stroke="#1e3a5f" stroke-width="2" />
  <circle cx="100" cy="100" r="74" fill="url(#bgGrad)" opacity="0.15" />

  <!-- Flowing Pipe Arc -->
  <path d="M 30 115 C 50 145, 150 145, 170 115" fill="none" stroke="url(#pipeGrad)" stroke-width="9" stroke-linecap="round" opacity="0.75" />
  <path d="M 30 115 C 50 145, 150 145, 170 115" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" />

  <!-- Water Bubbles -->
  <circle cx="55" cy="85" r="4" fill="#bae6fd" opacity="0.6" />
  <circle cx="150" cy="80" r="5" fill="#bae6fd" opacity="0.5" />
  <circle cx="138" cy="65" r="3" fill="#bae6fd" opacity="0.7" />

  <!-- Aquatic Dino (Plesiosaur / Water Dragon) -->
  <g id="aquatic-dino" filter="url(#glow)">
    <!-- Back flipper -->
    <path d="M 70 120 C 58 135, 52 145, 62 148 C 72 150, 82 135, 82 122 Z" fill="#0284c7" />

    <!-- Body & Tail -->
    <path d="M 65 110 C 50 115, 38 105, 32 96 C 42 100, 56 102, 68 105 C 80 108, 120 125, 135 110 C 145 100, 132 85, 118 80 C 105 75, 95 65, 98 48 C 100 35, 115 28, 128 32 C 136 34, 142 42, 136 48 C 128 54, 116 52, 112 62 C 108 72, 118 82, 125 86 C 140 94, 148 112, 132 124 C 115 136, 85 125, 65 110 Z" fill="url(#dinoGrad)" />

    <!-- Front flipper (Swimming stroke) -->
    <path d="M 108 115 C 118 132, 128 144, 138 142 C 144 140, 140 126, 125 114 Z" fill="#38bdf8" />

    <!-- Cute Eye & Friendly Pupil -->
    <ellipse cx="125" cy="38" rx="4.5" ry="5.5" fill="#ffffff" />
    <circle cx="126" cy="38" r="2.8" fill="#091326" />
    <circle cx="127" cy="36.5" r="1.1" fill="#ffffff" />

    <!-- Friendly Smile -->
    <path d="M 132 44 Q 128 47 124 45" fill="none" stroke="#091326" stroke-width="1.4" stroke-linecap="round" />

    <!-- Belly Accent Plates -->
    <path d="M 92 88 Q 102 98 116 102" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M 82 96 Q 92 106 104 110" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Water Drop Crown -->
  <path d="M 100 18 C 96 24, 93 28, 93 32 A 7 7 0 0 0 107 32 C 107 28, 104 24, 100 18 Z" fill="#38bdf8" />
</svg>
