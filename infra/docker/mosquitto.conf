# Mosquitto MQTT Configuration for DinoFlow Local-First Architecture
# Standard MQTT listener for ESP32 and backend
listener 1883 0.0.0.0
allow_anonymous true

# WebSockets listener for web browsers and PWA live telemetry inspection
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
